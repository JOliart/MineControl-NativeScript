<ActionBar class="action-bar">
    <NavigationButton
        text="Atras"
        android.systemIcon="ic_menu_back"
        (tap)="volver()">
    </NavigationButton>

    <Label
        class="action-bar-title"
        text="Detalle del Equipo">
    </Label>
</ActionBar>

<PullToRefresh (refresh)="actualizar($event)">

    <ScrollView>
        <StackLayout class="page">

            <!--
                Referencia de vista utilizada por:
                @ViewChild("panelAnimado")
            -->
            <StackLayout
                #panelAnimado
                padding="15"
                margin="5"
                backgroundColor="#FFFFFF">

                <Label
                    class="titulo"
                    text="MineControl">
                </Label>

                <StackLayout *ngIf="equipo">

                    <Label
                        class="codigo"
                        [text]="equipo.codigo">
                    </Label>

                    <Label
                        class="nombre"
                        [text]="equipo.nombre">
                    </Label>

                    <Label
                        class="dato"
                        [text]="'Area: ' + equipo.area">
                    </Label>

                    <Label
                        class="dato"
                        [text]="'Estado: ' + equipo.estado">
                    </Label>

                </StackLayout>

            </StackLayout>


            <!-- PRACTICA DE ANIMACIONES -->

            <Label
                text="Animaciones"
                fontSize="20"
                fontWeight="bold"
                marginTop="15"
                marginBottom="10">
            </Label>

            <!-- Requisito 3: color con delay -->
            <Button
                text="ANIMAR COLOR"
                class="btn btn-primary"
                (tap)="animarColor()">
            </Button>

            <!-- Requisito 4: scale + rotate -->
            <Button
                text="ANIMAR ESCALA Y ROTACION"
                class="btn btn-primary"
                (tap)="animarTransformacion()">
            </Button>


            <!-- LISTA AVANZADA -->

            <StackLayout *ngIf="equipo">

                <Label
                    text="Observaciones"
                    fontSize="20"
                    fontWeight="bold"
                    marginTop="20"
                    marginBottom="10">
                </Label>

                <ListView
                    [items]="equipo.observaciones"
                    height="350">

                    <ng-template let-observacion="item">

                        <GridLayout
                            columns="40, *, auto"
                            rows="auto, auto, auto"
                            padding="8"
                            margin="3">

                            <!-- Icono -->
                            <Label
                                row="0"
                                col="0"
                                rowSpan="2"
                                [text]="observacion.icono"
                                fontSize="22"
                                verticalAlignment="middle">
                            </Label>

                            <!-- Descripcion -->
                            <Label
                                row="0"
                                col="1"
                                colSpan="2"
                                [text]="observacion.descripcion"
                                textWrap="true"
                                fontSize="16">
                            </Label>

                            <!-- Usuario -->
                            <Label
                                row="1"
                                col="1"
                                [text]="'Usuario: ' + observacion.usuario"
                                fontSize="12">
                            </Label>

                            <!-- Estado -->
                            <Label
                                row="1"
                                col="2"
                                [text]="observacion.estado"
                                fontSize="12">
                            </Label>

                            <!-- Voto positivo -->
                            <Button
                                row="2"
                                col="0"
                                [text]="'👍 ' + observacion.votosPositivos"
                                (tap)="votarPositivo(observacion)">
                            </Button>

                            <!-- Voto negativo -->
                            <Button
                                row="2"
                                col="1"
                                [text]="'👎 ' + observacion.votosNegativos"
                                (tap)="votarNegativo(observacion)">
                            </Button>

                            <!-- Action dialog -->
                            <Button
                                row="2"
                                col="2"
                                text="EDITAR"
                                (tap)="editarObservacion(observacion)">
                            </Button>

                        </GridLayout>

                    </ng-template>

                </ListView>

            </StackLayout>


            <!-- EDICION DEL EQUIPO -->

            <Button
                text="EDITAR EQUIPO"
                class="btn btn-primary"
                *ngIf="equipo"
                (tap)="editar()">
            </Button>

            <Button
                text="VOLVER"
                class="btn"
                (tap)="volver()">
            </Button>

        </StackLayout>
    </ScrollView>

</PullToRefresh>
