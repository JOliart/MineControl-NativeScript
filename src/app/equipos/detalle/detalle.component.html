<ActionBar class="action-bar">
    <NavigationButton
        text="Atras"
        android.systemIcon="ic_menu_back"
        (tap)="volver()">
    </NavigationButton>

    <Label
        class="action-bar-title"
        text="Detalle del Equipo">
    </Label>
</ActionBar>

<GridLayout rows="auto, auto, auto, *" class="page" *ngIf="equipo">

    <Label
        row="0"
        class="titulo"
        text="MineControl">
    </Label>

    <StackLayout row="1" class="datos-equipo">
        <Label class="codigo" [text]="equipo.codigo"></Label>
        <Label class="nombre" [text]="equipo.nombre"></Label>
        <Label class="dato" [text]="'Area: ' + equipo.area"></Label>
        <Label class="dato" [text]="'Estado: ' + equipo.estado"></Label>
    </StackLayout>

    <Label
        row="2"
        class="subtitulo"
        text="Historial / Observaciones">
    </Label>

    <ListView
        row="3"
        [items]="equipo.observaciones"
        (pullToRefresh)="actualizar($event)"
        pullToRefresh="true">

        <ng-template let-observacion="item">

            <GridLayout
                columns="45, *, auto"
                rows="auto, auto"
                class="observacion">

                <Label
                    row="0"
                    rowSpan="2"
                    col="0"
                    [text]="observacion.icono"
                    class="icono">
                </Label>

                <Label
                    row="0"
                    col="1"
                    [text]="observacion.descripcion"
                    textWrap="true"
                    class="descripcion">
                </Label>

                <GridLayout
                    row="0"
                    rowSpan="2"
                    col="2"
                    columns="auto, auto, auto"
                    class="votos">

                    <Button
                        col="0"
                        [text]="'👍 ' + observacion.votosPositivos"
                        (tap)="votoPositivo(observacion)"
                        class="btn-voto">
                    </Button>

                    <Button
                        col="1"
                        [text]="'👎 ' + observacion.votosNegativos"
                        (tap)="votoNegativo(observacion)"
                        class="btn-voto">
                    </Button>

		    <Button
			col="2"
    			text="EDITAR"
    			(tap)="editarEstado(observacion)"
    			class="btn-editar">
		    </Button>

                </GridLayout>

                <GridLayout
                    row="1"
                    col="1"
                    columns="*, auto">

                    <Label
                        col="0"
                        [text]="'Usuario: ' + observacion.usuario"
                        class="usuario">
                    </Label>

                    <Label
                        col="1"
                        [text]="observacion.estado"
                        class="estado-observacion">
                    </Label>

                </GridLayout>

            </GridLayout>

        </ng-template>

    </ListView>

</GridLayout>
