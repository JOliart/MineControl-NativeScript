<ActionBar class="action-bar">

    <NavigationButton
        text="Atras"
        android.systemIcon="ic_menu_back"
        (tap)="volver()">
    </NavigationButton>

    <Label
        class="action-bar-title"
        text="Detalle del Equipo">
    </Label>

</ActionBar>

<ScrollView>

    <StackLayout class="page" *ngIf="equipo">

        <Label
            class="titulo"
            text="MineControl">
        </Label>

        <Label
            class="codigo"
            [text]="equipo.codigo">
        </Label>

        <Label
            class="nombre"
            [text]="equipo.nombre">
        </Label>

        <Label
            class="dato"
            [text]="'Area: ' + equipo.area">
        </Label>

        <Label
            class="dato"
            [text]="'Estado: ' + equipo.estado">
        </Label>


        <!-- ========================================= -->
        <!-- PRACTICA DE ANIMACIONES                   -->
        <!-- ========================================= -->

        <Label
            class="subtitulo"
            text="Animaciones">
        </Label>

        <!--
            Requisito:
            variable de vista #panelAnimado.

            Este mismo boton es el elemento que se anima
            mediante @ViewChild en detalle.component.ts.
        -->
        <Button
            #panelAnimado
            text="ANIMAR COLOR"
            class="btn btn-primary"
            backgroundColor="#FFFFFF"
            (tap)="animarColor()">
        </Button>

        <!--
            Segunda animacion:
            scale + rotate.
            Se anima el mismo boton referenciado por ViewChild.
        -->
        <Button
            text="ANIMAR ESCALA Y ROTACION"
            class="btn btn-primary"
            (tap)="animarTransformacion()">
        </Button>


        <!-- ========================================= -->
        <!-- OBSERVACIONES                             -->
        <!-- ========================================= -->

        <Label
            class="subtitulo"
            text="Observaciones">
        </Label>

        <ListView
            [items]="equipo.observaciones"
            height="350"
            class="lista-observaciones">

            <ng-template let-observacion="item">

                <GridLayout
                    columns="40, *, auto"
                    rows="auto, auto, auto"
                    class="observacion">

                    <Label
                        row="0"
                        col="0"
                        rowSpan="2"
                        [text]="observacion.icono"
                        class="icono-observacion">
                    </Label>

                    <Label
                        row="0"
                        col="1"
                        colSpan="2"
                        [text]="observacion.descripcion"
                        textWrap="true"
                        class="texto-observacion">
                    </Label>

                    <Label
                        row="1"
                        col="1"
                        [text]="'Usuario: ' + observacion.usuario">
                    </Label>

                    <Label
                        row="1"
                        col="2"
                        [text]="'Estado: ' + observacion.estado"
                        class="estado-observacion">
                    </Label>

                    <Button
                        row="2"
                        col="0"
                        [text]="'+' + observacion.votosPositivos"
                        class="btn-voto"
                        (tap)="votarPositivo(observacion)">
                    </Button>

                    <Button
                        row="2"
                        col="1"
                        [text]="'-' + observacion.votosNegativos"
                        class="btn-voto"
                        (tap)="votarNegativo(observacion)">
                    </Button>

                    <Button
                        row="2"
                        col="2"
                        text="EDITAR"
                        class="btn-accion"
                        (tap)="editarObservacion(observacion)">
                    </Button>

                </GridLayout>

            </ng-template>

        </ListView>


        <!-- ========================================= -->
        <!-- EDICION Y NAVEGACION                      -->
        <!-- ========================================= -->

        <Button
            text="EDITAR EQUIPO"
            class="btn btn-primary"
            (tap)="editar()">
        </Button>

        <Button
            text="VOLVER"
            class="btn"
            (tap)="volver()">
        </Button>

    </StackLayout>

</ScrollView>
