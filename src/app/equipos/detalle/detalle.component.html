<ActionBar class="action-bar">

    <NavigationButton
        text="Atras"
        android.systemIcon="ic_menu_back"
        (tap)="volver()">
    </NavigationButton>

    <Label
        class="action-bar-title"
        text="Detalle del Equipo">
    </Label>

</ActionBar>

<ScrollView>

    <StackLayout
        class="page"
        *ngIf="equipo">

        <Label
            class="titulo"
            text="MineControl">
        </Label>

        <Label
            class="codigo"
            [text]="equipo.codigo">
        </Label>

        <Label
            class="nombre"
            [text]="equipo.nombre">
        </Label>

        <Label
            class="dato"
            [text]="'Area: ' + equipo.area">
        </Label>

        <Label
            class="dato"
            [text]="'Estado: ' + equipo.estado">
        </Label>

        <!-- Listado avanzado de observaciones -->
        <Label
            class="subtitulo"
            text="Observaciones">
        </Label>

        <ListView
            [items]="equipo.observaciones"
            class="lista-observaciones">

            <ng-template
                let-observacion="item"
                let-i="index">

                <GridLayout
                    columns="auto, *, auto"
                    rows="auto, auto"
                    class="observacion">

                    <Label
                        col="0"
                        row="0"
                        rowSpan="2"
                        class="icono-observacion"
                        text="&#xf075;">
                    </Label>

                    <Label
                        col="1"
                        row="0"
                        class="texto-observacion"
                        [text]="observacion.texto"
                        textWrap="true">
                    </Label>

                    <Label
                        col="1"
                        row="1"
                        class="estado-observacion"
                        [text]="'Estado: ' + observacion.estado">
                    </Label>

                    <StackLayout
                        col="2"
                        row="0"
                        rowSpan="2"
                        orientation="horizontal">

                        <Button
                            text="+"
                            class="btn-voto"
                            (tap)="votarPositivo(observacion)">
                        </Button>

                        <Button
                            text="-"
                            class="btn-voto"
                            (tap)="votarNegativo(observacion)">
                        </Button>

                        <Button
                            text="EDITAR"
                            class="btn-accion"
                            (tap)="editarObservacion(observacion)">
                        </Button>

                    </StackLayout>

                </GridLayout>

            </ng-template>

        </ListView>

        <!-- Nuevo componente de edicion de datos -->
        <Button
            text="EDITAR EQUIPO"
            class="btn btn-primary"
            (tap)="editar()">
        </Button>

        <Button
            text="VOLVER"
            class="btn"
            (tap)="volver()">
        </Button>

    </StackLayout>

</ScrollView>
