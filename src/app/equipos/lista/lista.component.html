<ActionBar class="action-bar">
    <Label
        class="action-bar-title"
        text="MineControl - Equipos">
    </Label>
</ActionBar>

<GridLayout rows="auto, auto, auto, *" class="page">

    <!-- Cabecera -->
    <StackLayout row="0">

        <Image
            src="res://minecontrol"
            width="60"
            height="60"
            stretch="aspectFit">
        </Image>

        <Label
            class="titulo"
            text="Equipos de Planta">
        </Label>

        <Label
            class="plataforma"
            [text]="'Plataforma: ' + plataforma">
        </Label>

    </StackLayout>

    <!-- Buscador con Two Way Binding -->
    <GridLayout
        row="1"
        columns="*, auto, auto"
        class="buscador">

        <TextField
            col="0"
            hint="Codigo, nombre, area o estado"
            [(ngModel)]="textoBusqueda"
            name="busqueda"
            minimoBusqueda
            #campoBusqueda="ngModel"
            returnKeyType="search"
            (returnPress)="buscar()">
        </TextField>

        <Button
            col="1"
            text="BUSCAR"
            (tap)="buscar()">
        </Button>

        <Button
            col="2"
            text="X"
            (tap)="limpiarBusqueda()">
        </Button>

    </GridLayout>

    <!-- Acceso al listado SQLite de favoritos -->
    <Button
        row="2"
        text="★ VER FAVORITOS"
        class="btn-favoritos"
        (tap)="verFavoritos()">
    </Button>

    <!-- Pull To Refresh -->
    <PullToRefresh
        row="3"
        (refresh)="refrescar($event)">

        <ListView
            [items]="resultadosBusqueda"
            class="lista-equipos">

            <ng-template let-equipo="item">

                <FlexboxLayout
                    flexDirection="column"
                    class="equipo">

                    <!-- Tap sobre los datos abre el detalle -->
                    <StackLayout
                        (tap)="verDetalle(equipo)">

                        <Label
                            class="codigo"
                            [text]="equipo.codigo">
                        </Label>

                        <Label
                            class="nombre"
                            [text]="equipo.nombre">
                        </Label>

                        <Label
                            [text]="'Área: ' + equipo.area">
                        </Label>

                        <Label
                            class="estado"
                            [text]="'Estado: ' + equipo.estado">
                        </Label>

                    </StackLayout>

                    <!--
                        Requisito de la practica:
                        icono/boton dentro del ListView que
                        guarda el item mediante SQLite.
                    -->
                    <Button
                        text="★ FAVORITO"
                        class="btn-favorito"
                        (tap)="agregarFavorito(equipo)">
                    </Button>

                    <!-- Mantiene la funcionalidad Action -->
                    <Button
                        text="CAMBIAR ESTADO"
                        class="btn-estado"
                        (tap)="cambiarEstado(equipo)">
                    </Button>

                </FlexboxLayout>

            </ng-template>

        </ListView>

    </PullToRefresh>

</GridLayout>
