<ActionBar class="action-bar">
    <Label
        class="action-bar-title"
        text="MineControl - Equipos">
    </Label>
</ActionBar>

<GridLayout rows="auto, auto, *" class="page">

    <!-- Encabezado -->
    <StackLayout row="0">

        <!-- Imagen cargada desde App_Resources -->
        <Image
            src="res://minecontrol"
            width="60"
            height="60"
            stretch="aspectFit">
        </Image>

        <Label
            class="titulo"
            text="Equipos de Planta">
        </Label>

        <Label
            class="plataforma"
            [text]="'Plataforma: ' + plataforma">
        </Label>

    </StackLayout>


    <!-- Formulario de busqueda -->
    <GridLayout
        row="1"
        columns="*, auto, auto"
        class="buscador">

        <TextField
            col="0"
            hint="Codigo, nombre, area o estado"
            [(ngModel)]="textoBusqueda"
            name="busqueda"
            minimoBusqueda
            #campoBusqueda="ngModel"
            returnKeyType="search"
            (returnPress)="buscar()">
        </TextField>

        <Button
            col="1"
            text="BUSCAR"
            (tap)="buscar()">
        </Button>

        <Button
            col="2"
            text="X"
            (tap)="limpiarBusqueda()">
        </Button>

    </GridLayout>


    <!-- Pull to Refresh -->
    <PullToRefresh
        row="2"
        (refresh)="refrescar($event)">

        <!-- ListView requerido por la practica -->
        <ListView
            [items]="resultadosBusqueda"
            class="lista-equipos">

            <ng-template let-equipo="item">

                <!-- Plantilla anidada basada en FlexboxLayout -->
                <FlexboxLayout
                    flexDirection="column"
                    class="equipo"
                    (tap)="verDetalle(equipo)"
                    (longPress)="cambiarEstado(equipo)">

                    <Label
                        class="codigo"
                        [text]="equipo.codigo">
                    </Label>

                    <Label
                        class="nombre"
                        [text]="equipo.nombre">
                    </Label>

                    <Label
                        [text]="'Area: ' + equipo.area">
                    </Label>

                    <Label
                        class="estado"
                        [text]="'Estado: ' + equipo.estado">
                    </Label>

                    <Label
                        class="ayuda"
                        text="Tap: ver detalle | Mantener pulsado: cambiar estado">
                    </Label>

                </FlexboxLayout>

            </ng-template>

        </ListView>

    </PullToRefresh>

</GridLayout>
