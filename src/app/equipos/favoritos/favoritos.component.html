<ActionBar class="action-bar">

    <NavigationButton
        text="Atras"
        android.systemIcon="ic_menu_back"
        (tap)="volver()">
    </NavigationButton>

    <Label
        class="action-bar-title"
        text="MineControl - Favoritos">
    </Label>

</ActionBar>

<GridLayout
    rows="auto, auto, *"
    class="page">

    <!-- Cabecera -->
    <StackLayout
        row="0"
        class="cabecera">

        <Label
            class="titulo"
            text="Equipos Favoritos">
        </Label>

        <Label
            class="descripcion"
            text="Equipos almacenados localmente en SQLite"
            textWrap="true">
        </Label>

    </StackLayout>

    <!-- Actualiza la consulta de favoritos desde SQLite -->
    <Button
        row="1"
        text="ACTUALIZAR FAVORITOS"
        class="btn-actualizar"
        (tap)="actualizar()">
    </Button>

    <!-- Listado de favoritos almacenados en SQLite -->
    <ListView
        row="2"
        [items]="favoritos"
        class="lista-favoritos">

        <ng-template let-favorito="item">

            <FlexboxLayout
                flexDirection="column"
                class="favorito">

                <Label
                    class="codigo"
                    [text]="favorito.codigo">
                </Label>

                <Label
                    class="nombre"
                    [text]="favorito.nombre">
                </Label>

                <Label
                    class="dato"
                    [text]="'Area: ' + favorito.area">
                </Label>

                <Label
                    class="estado"
                    [text]="'Estado: ' + favorito.estado">
                </Label>

                <!--
                    REQUISITO REDUX / NGRX

                    Al pulsar LEER AHORA se ejecuta
                    leerAhora(favorito).

                    El componente despacha una Action
                    al Store mediante store.dispatch().
                -->
                <Button
                    text="LEER AHORA"
                    class="btn-leer"
                    (tap)="leerAhora(favorito)">
                </Button>

                <!-- Persistencia SQLite -->
                <Button
                    text="ELIMINAR DE FAVORITOS"
                    class="btn-eliminar"
                    (tap)="eliminar(favorito)">
                </Button>

            </FlexboxLayout>

        </ng-template>

    </ListView>

</GridLayout>
